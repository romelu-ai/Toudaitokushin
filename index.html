<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢文重要単語300 | 単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper: #f1ecdd;
  --paper-deep: #e8e0cc;
  --ink: #26241f;
  --ink-soft: #514c40;
  --indigo: #33465a;
  --seal: #ac3b26;
  --seal-deep: #8c2e1c;
  --gold: #a9863f;
  --line: rgba(38,36,31,0.16);
  --card-shadow: 0 1px 0 rgba(38,36,31,0.06), 0 18px 40px -22px rgba(38,36,31,0.45);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(172,59,38,0.07), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(51,70,90,0.08), transparent 55%),
    var(--paper);
  color:var(--ink);
  font-family:'Noto Sans JP', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

body.dark{
  --paper:#1b1a17;
  --paper-deep:#242220;
  --ink:#eee6d3;
  --ink-soft:#c9bfa8;
  --indigo:#9fb3c8;
  --seal:#e0684a;
  --seal-deep:#c94f34;
  --gold:#d8b76a;
  --line: rgba(238,230,211,0.14);
  --card-shadow: 0 1px 0 rgba(0,0,0,0.4), 0 18px 40px -22px rgba(0,0,0,0.7);
}

.paper-texture{
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
  background-image:
    repeating-linear-gradient(0deg, rgba(38,36,31,0.015) 0px, rgba(38,36,31,0.015) 1px, transparent 1px, transparent 3px);
}
body.dark .paper-texture{
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
}

.wrap{
  position:relative; z-index:1;
  max-width:920px;
  margin:0 auto;
  padding:28px 20px 80px;
}

/* ---------- Header ---------- */
header.top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  padding-bottom:22px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line);
}
.title-block{display:flex; align-items:baseline; gap:14px;}
.seal-mark{
  flex:none;
  width:40px; height:40px;
  border-radius:6px;
  background:var(--seal);
  color:#f6ede0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:17px;
  letter-spacing:0;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  transform:rotate(-3deg);
}
h1{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:26px;
  margin:0;
  letter-spacing:0.02em;
}
.sub{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:3px;
  letter-spacing:0.03em;
}
#theme-toggle{
  flex:none;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  width:38px;height:38px;
  border-radius:50%;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
#theme-toggle:hover{background:var(--paper-deep);}
#theme-toggle svg{width:17px;height:17px;}
#theme-toggle #sun{display:none;}
body.dark #theme-toggle #moon{display:none;}
body.dark #theme-toggle #sun{display:block;}

/* ---------- Nav tabs ---------- */
.tabs{
  display:flex;
  gap:6px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.tab-btn{
  font-family:'Noto Sans JP', sans-serif;
  font-size:13.5px;
  font-weight:600;
  padding:9px 16px;
  border-radius:20px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink-soft);
  cursor:pointer;
  transition:all .18s;
}
.tab-btn:hover{ color:var(--ink); }
.tab-btn.active{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}

.view{ display:none; }
.view.active{ display:block; }

/* ---------- Controls row (group filter + progress) ---------- */
.controls-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
select#group-select, select#group-select-list{
  font-family:'Noto Sans JP', sans-serif;
  font-size:13.5px;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
}
.progress-line{
  font-size:12.5px;
  color:var(--ink-soft);
  display:flex;
  align-items:center;
  gap:10px;
}
.progress-track{
  width:110px;height:6px;border-radius:4px;
  background:var(--line);
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--seal);
  border-radius:4px;
  transition:width .3s;
}

/* ---------- Flashcard ---------- */
.stage{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
.card-index{
  font-size:12px;
  letter-spacing:0.12em;
  color:var(--ink-soft);
  font-family:'Noto Sans JP', sans-serif;
}
.card-outer{
  perspective:1600px;
  width:100%;
  max-width:520px;
  height:340px;
}
.card-inner{
  position:relative;
  width:100%;height:100%;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
  transform-style:preserve-3d;
  cursor:pointer;
}
.card-inner.flipped{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0;
  border-radius:14px;
  background:var(--paper);
  box-shadow:var(--card-shadow);
  border:1px solid var(--line);
  backface-visibility:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px;
  text-align:center;
}
.face.back{ transform:rotateY(180deg); }
.face .group-chip{
  position:absolute;
  top:16px; left:18px;
  font-size:11px;
  color:var(--ink-soft);
  border:1px solid var(--line);
  padding:3px 9px;
  border-radius:12px;
  letter-spacing:0.04em;
}
.mastered-mark{
  position:absolute;
  top:14px; right:16px;
  width:34px;height:34px;
  border-radius:50%;
  border:2px solid var(--seal);
  color:var(--seal);
  display:flex;align-items:center;justify-content:center;
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  background:transparent;
  transform:rotate(-6deg);
  opacity:0.25;
  transition:opacity .2s, transform .2s;
}
.mastered-mark.on{ opacity:1; background:rgba(172,59,38,0.08); }
.mastered-mark:hover{ transform:rotate(-6deg) scale(1.06); }

.kanji-big{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:56px;
  line-height:1.15;
  word-break:keep-all;
}
.hint-text{
  margin-top:14px;
  font-size:12px;
  color:var(--ink-soft);
  letter-spacing:0.05em;
}
.reading-big{
  font-family:'Noto Sans JP', sans-serif;
  font-weight:700;
  font-size:22px;
  color:var(--seal-deep);
  margin-bottom:14px;
}
.meaning-text{
  font-size:15.5px;
  line-height:1.85;
  color:var(--ink);
  max-height:210px;
  overflow-y:auto;
  padding:0 4px;
}

.nav-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-top:4px;
}
.nav-btn{
  font-family:'Noto Sans JP', sans-serif;
  font-size:13.5px;
  font-weight:600;
  padding:10px 20px;
  border-radius:24px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  cursor:pointer;
  transition:all .18s;
}
.nav-btn:hover{ background:var(--paper-deep); }
.nav-btn.primary{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}
.nav-btn.primary:hover{ background:var(--indigo); border-color:var(--indigo); }
.nav-btn:disabled{ opacity:0.35; cursor:default; }
.icon-btn{
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink-soft);
  width:40px;height:40px;
  border-radius:50%;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.icon-btn:hover{ color:var(--ink); background:var(--paper-deep); }
.icon-btn svg{width:16px;height:16px;}

.keyhint{
  text-align:center;
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:6px;
}

/* ---------- List view ---------- */
.search-box{
  width:100%;
  padding:11px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans JP', sans-serif;
  font-size:14px;
  margin-bottom:14px;
}
.word-list{
  display:flex;
  flex-direction:column;
  gap:1px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}
.word-row{
  display:grid;
  grid-template-columns:34px 1fr 90px;
  gap:14px;
  align-items:center;
  padding:13px 16px;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition:background .15s;
}
.word-row:last-child{ border-bottom:none; }
.word-row:hover{ background:var(--paper-deep); }
.word-row .num{
  font-size:11px; color:var(--ink-soft); text-align:right;
}
.word-row .wk{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:17px;
}
.word-row .wr{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:2px;
}
.word-row .wm{
  font-size:12px;
  color:var(--ink-soft);
  text-align:right;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.word-row.mastered .wk{ color:var(--seal-deep); }

.detail-panel{
  position:fixed;
  inset:0;
  background:rgba(20,18,14,0.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}
.detail-panel.show{ display:flex; }
.detail-card{
  background:var(--paper);
  border-radius:16px;
  max-width:440px;
  width:100%;
  padding:30px;
  box-shadow:var(--card-shadow);
  position:relative;
}
.detail-close{
  position:absolute; top:14px; right:14px;
  border:none; background:transparent; color:var(--ink-soft);
  cursor:pointer; font-size:20px; line-height:1;
}
.detail-kanji{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:34px;
}
.detail-reading{
  font-weight:700;
  color:var(--seal-deep);
  margin:8px 0 16px;
  font-size:16px;
}
.detail-meaning{ font-size:14.5px; line-height:1.8; }

/* ---------- Stats view ---------- */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:26px;
}
.stat-card{
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px;
  text-align:center;
  background:var(--paper);
}
.stat-num{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:30px;
  color:var(--seal-deep);
}
.stat-label{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

.group-bars{ display:flex; flex-direction:column; gap:10px; }
.group-bar-row{ display:flex; align-items:center; gap:12px; }
.group-bar-label{ width:52px; font-size:12.5px; color:var(--ink-soft); flex:none; }
.group-bar-track{ flex:1; height:9px; border-radius:5px; background:var(--line); overflow:hidden; }
.group-bar-fill{ height:100%; background:var(--indigo); border-radius:5px; }
.group-bar-count{ width:56px; text-align:right; font-size:11.5px; color:var(--ink-soft); flex:none; }

.reset-row{ margin-top:26px; text-align:center; }
.reset-btn{
  font-size:12.5px;
  color:var(--seal-deep);
  background:none;
  border:1px solid var(--line);
  padding:8px 16px;
  border-radius:18px;
  cursor:pointer;
}
.reset-btn:hover{ background:var(--paper-deep); }

footer{
  text-align:center;
  color:var(--ink-soft);
  font-size:12px;
  margin-top:50px;
  padding-top:20px;
  border-top:1px solid var(--line);
}
footer a{ color:var(--ink-soft); }

@media (max-width:560px){
  h1{ font-size:21px; }
  .kanji-big{ font-size:44px; }
  .card-outer{ height:320px; }
  .stats-grid{ grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-num{ font-size:22px; }
  .word-row{ grid-template-columns:28px 1fr 60px; }
  .word-row .wm{ display:none; }
}
</style>
</head>
<body>

<div class="paper-texture"></div>

<div class="wrap">

  <header class="top">
    <div class="title-block">
      <div class="seal-mark">漢</div>
      <div>
        <h1>漢文重要単語300</h1>
        <div class="sub">読み方・意味を覚えるフラッシュカード</div>
      </div>
    </div>
    <button id="theme-toggle" title="表示切替">
      <svg id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-view="cards">カード学習</button>
    <button class="tab-btn" data-view="list">一覧・検索</button>
    <button class="tab-btn" data-view="stats">学習状況</button>
  </nav>

  <!-- ===== Flashcard view ===== -->
  <section id="view-cards" class="view active">
    <div class="controls-row">
      <select id="group-select"></select>
      <div class="progress-line">
        <span id="progress-text">1 / 300</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>

    <div class="stage">
      <div class="card-index" id="card-index-label"></div>
      <div class="card-outer">
        <div class="card-inner" id="card-inner">
          <div class="face front">
            <span class="group-chip" id="chip-front"></span>
            <button class="mastered-mark" id="mastered-front" title="覚えた">済</button>
            <div class="kanji-big" id="kanji-front"></div>
            <div class="hint-text">タップして読み方・意味を表示</div>
          </div>
          <div class="face back">
            <span class="group-chip" id="chip-back"></span>
            <button class="mastered-mark" id="mastered-back" title="覚えた">済</button>
            <div class="kanji-big" id="kanji-back" style="font-size:32px;"></div>
            <div class="reading-big" id="reading-back"></div>
            <div class="meaning-text" id="meaning-back"></div>
          </div>
        </div>
      </div>

      <div class="nav-row">
        <button class="icon-btn" id="shuffle-btn" title="シャッフル">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="nav-btn" id="prev-btn">← 前</button>
        <button class="nav-btn primary" id="flip-btn">めくる</button>
        <button class="nav-btn" id="next-btn">次 →</button>
      </div>
      <div class="keyhint">← / → で移動　・　スペースでめくる</div>
    </div>
  </section>

  <!-- ===== List view ===== -->
  <section id="view-list" class="view">
    <div class="controls-row">
      <select id="group-select-list"></select>
    </div>
    <input type="text" class="search-box" id="search-input" placeholder="漢字・読み方・意味で検索…">
    <div class="word-list" id="word-list"></div>
  </section>

  <!-- ===== Stats view ===== -->
  <section id="view-stats" class="view">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="stat-total">300</div><div class="stat-label">総単語数</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-mastered">0</div><div class="stat-label">覚えた語</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-rate">0%</div><div class="stat-label">達成率</div></div>
    </div>
    <div class="group-bars" id="group-bars"></div>
    <div class="reset-row">
      <button class="reset-btn" id="reset-btn">学習記録をリセット</button>
    </div>
  </section>

  <footer>
    <p>Get in touch: <a href="mailto:okamotoshoei451@gmail.com">okamotoshoei451@gmail.com</a></p>
  </footer>
</div>

<!-- ===== Detail modal (list view) ===== -->
<div class="detail-panel" id="detail-panel">
  <div class="detail-card">
    <button class="detail-close" id="detail-close">&times;</button>
    <div class="detail-kanji" id="detail-kanji"></div>
    <div class="detail-reading" id="detail-reading"></div>
    <div class="detail-meaning" id="detail-meaning"></div>
  </div>
</div>

<script>

/* ---------- Theme ---------- */
if (localStorage.getItem("pref-theme") === "dark") {
  document.body.classList.add('dark');
} else if (localStorage.getItem("pref-theme") === "light") {
  document.body.classList.remove('dark');
} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.body.classList.add('dark');
}
document.getElementById('theme-toggle').addEventListener('click', () => {
  document.body.classList.toggle('dark');

});

/* ---------- Mastered persistence ---------- */
const STORAGE_KEY = 'kanbun300-mastered';
function loadMastered(){
  try{ return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function saveMastered(set){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(set)));
}
let mastered = loadMastered();

    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));

/* ---------- Group setup ---------- */
const groups = Array.from(new Set(WORDS.map(w=>w.group))).sort((a,b)=>a-b);
function fillGroupSelect(sel, withAll){
  sel.innerHTML='';
  if(withAll){
    const o=document.createElement('option'); o.value='all'; o.textContent='すべて (全300語)';
    sel.appendChild(o);
  }
  groups.forEach(g=>{
    const count = WORDS.filter(w=>w.group===g).length;
    const o=document.createElement('option');
    o.value=g;
    o.textContent = `第${g}課 (${count}語)`;
    sel.appendChild(o);
  });
}
const groupSelect = document.getElementById('group-select');
const groupSelectList = document.getElementById('group-select-list');
fillGroupSelect(groupSelect, true);
fillGroupSelect(groupSelectList, true);

/* ---------- Flashcard state ---------- */
let deck = WORDS.slice();
let order = deck.map((_,i)=>i);
let pos = 0;
let flipped = false;

function currentSetFromGroup(val){
  if(val==='all') return WORDS.slice();
  const g = parseInt(val,10);
  return WORDS.filter(w=>w.group===g);
}

function setDeck(newDeck, reshuffleOrder){
  deck = newDeck;
  order = deck.map((_,i)=>i);
  if(reshuffleOrder) shuffleOrder();
  pos = 0;
  flipped = false;
  renderCard();
}

function shuffleOrder(){
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
}

const cardInner = document.getElementById('card-inner');
const kanjiFront = document.getElementById('kanji-front');
const kanjiBack = document.getElementById('kanji-back');
const readingBack = document.getElementById('reading-back');
const meaningBack = document.getElementById('meaning-back');
const chipFront = document.getElementById('chip-front');
const chipBack = document.getElementById('chip-back');

const masteredBack = document.getElementById('mastered-back');
const cardIndexLabel = document.getElementById('card-index-label');
const progressText = document.getElementById('progress-text');
const progressFill = document.getElementById('progress-fill');

function renderCard(){
  if(deck.length===0){
    kanjiFront.textContent='該当なし';
    kanjiBack.textContent='';
    readingBack.textContent='';
    meaningBack.textContent='この課には単語がありません。';
    cardIndexLabel.textContent='';
    return;
  }
  const w = deck[order[pos]];
  kanjiFront.textContent = w.kanji;
  kanjiBack.textContent = w.kanji;
  readingBack.textContent = w.reading;
  meaningBack.textContent = w.meaning;
  chipFront.textContent = `第${w.group}課`;
  chipBack.textContent = `第${w.group}課`;
  cardIndexLabel.textContent = `${pos+1} / ${deck.length}枚`;
  const isM = mastered.has(w.id);
  masteredFront.classList.toggle('on', isM);
  masteredBack.classList.toggle('on', isM);
  cardInner.classList.remove('flipped');
  flipped = false;

  progressText.textContent = `${pos+1} / ${deck.length}`;
  progressFill.style.width = `${((pos+1)/deck.length)*100}%`;
}

function flipCard(){
  if(deck.length===0) return;
  flipped = !flipped;
  cardInner.classList.toggle('flipped', flipped);
}

function goNext(){
  if(deck.length===0) return;
  pos = (pos+1) % deck.length;
  renderCard();
}
function goPrev(){
  if(deck.length===0) return;
  pos = (pos-1+deck.length) % deck.length;
  renderCard();
}
function toggleMastered(){
  if(deck.length===0) return;
  const w = deck[order[pos]];
  if(mastered.has(w.id)) mastered.delete(w.id);
  else mastered.add(w.id);
  saveMastered(mastered);
  const isM = mastered.has(w.id);
  masteredFront.classList.toggle('on', isM);
  masteredBack.classList.toggle('on', isM);
}

cardInner.addEventListener('click', flipCard);
document.getElementById('flip-btn').addEventListener('click', flipCard);
document.getElementById('next-btn').addEventListener('click', goNext);
document.getElementById('prev-btn').addEventListener('click', goPrev);
document.getElementById('shuffle-btn').addEventListener('click', ()=>{ shuffleOrder(); pos=0; renderCard(); });
masteredFront.addEventListener('click', (e)=>{ e.stopPropagation(); toggleMastered(); });
masteredBack.addEventListener('click', (e)=>{ e.stopPropagation(); toggleMastered(); });

groupSelect.addEventListener('change', ()=>{
  setDeck(currentSetFromGroup(groupSelect.value), false);
});

document.addEventListener('keydown', (e)=>{
  if(!document.getElementById('view-cards').classList.contains('active')) return;
  if(e.key==='ArrowRight') goNext();
  else if(e.key==='ArrowLeft') goPrev();
  else if(e.key===' '){ e.preventDefault(); flipCard(); }
});

/* ---------- List view ---------- */
const wordListEl = document.getElementById('word-list');
const searchInput = document.getElementById('search-input');

function renderList(){
  const q = searchInput.value.trim().toLowerCase();
  const gVal = groupSelectList.value;
  let items = gVal==='all' ? WORDS.slice() : WORDS.filter(w=>w.group===parseInt(gVal,10));
  if(q){
    items = items.filter(w =>
      w.kanji.toLowerCase().includes(q) ||
      w.reading.toLowerCase().includes(q) ||
      w.meaning.toLowerCase().includes(q)
    );
  }
  wordListEl.innerHTML='';
  if(items.length===0){
    wordListEl.innerHTML = '<div class="word-row"><span></span><span style="color:var(--ink-soft)">該当する単語が見つかりません。</span><span></span></div>';
    return;
  }
  items.forEach(w=>{
    const row = document.createElement('div');
    row.className = 'word-row' + (mastered.has(w.id) ? ' mastered' : '');
    row.innerHTML = `
      <span class="num">${w.id}</span>
      <span>
        <div class="wk">${w.kanji}</div>
        <div class="wr">${w.reading}</div>
      </span>
      <span class="wm">${w.meaning}</span>
    `;
    row.addEventListener('click', ()=> openDetail(w));
    wordListEl.appendChild(row);
  });
}
groupSelectList.addEventListener('change', renderList);
searchInput.addEventListener('input', renderList);

const detailPanel = document.getElementById('detail-panel');
function openDetail(w){
  document.getElementById('detail-kanji').textContent = w.kanji;
  document.getElementById('detail-reading').textContent = w.reading;
  document.getElementById('detail-meaning').textContent = w.meaning;
  detailPanel.classList.add('show');
}
document.getElementById('detail-close').addEventListener('click', ()=> detailPanel.classList.remove('show'));
detailPanel.addEventListener('click', (e)=>{ if(e.target===detailPanel) detailPanel.classList.remove('show'); });

/* ---------- Stats view ---------- */
function renderStats(){
  const total = WORDS.length;
  const m = mastered.size;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-mastered').textContent = m;
  document.getElementById('stat-rate').textContent = total ? Math.round((m/total)*100)+'%' : '0%';

  const barsEl = document.getElementById('group-bars');
  barsEl.innerHTML='';
  groups.forEach(g=>{
    const wordsInG = WORDS.filter(w=>w.group===g);
    const masteredInG = wordsInG.filter(w=>mastered.has(w.id)).length;
    const pct = wordsInG.length ? (masteredInG/wordsInG.length)*100 : 0;
    const row = document.createElement('div');
    row.className='group-bar-row';
    row.innerHTML = `
      <div class="group-bar-label">第${g}課</div>
      <div class="group-bar-track"><div class="group-bar-fill" style="width:${pct}%"></div></div>
      <div class="group-bar-count">${masteredInG} / ${wordsInG.length}</div>
    `;
    barsEl.appendChild(row);
  });
}
document.getElementById('reset-btn').addEventListener('click', ()=>{
  if(confirm('学習記録（覚えた単語のマーク）をすべてリセットします。よろしいですか？')){
    mastered = new Set();
    saveMastered(mastered);
    renderCard();
    renderList();
    renderStats();
  }
});

/* ---------- Init ---------- */
setDeck(WORDS.slice(), false);
</script>
</body>
</html>
