<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東大特進 | 学習ツール一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #12151b;
  --ink: #f1ede4;
  --ink-soft: #a9a6a0;
  --seal: #d1493a;
  --indigo: #8fb0d6;
  --gold: #d9b46a;
  --line: rgba(255,255,255,0.16);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color: var(--bg);
  background-image:
    linear-gradient(180deg, rgba(18,21,27,0.22) 0%, rgba(18,21,27,0.55) 42%, rgba(18,21,27,0.86) 78%, var(--bg) 100%),
    url('assets/site-bg.jpg');
  background-repeat: no-repeat, no-repeat;
  background-position: top center, top center;
  background-size: 100% 100%, 100% auto;
  color:var(--ink);
  font-family:'Noto Sans JP', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:760px;
  margin:0 auto;
  padding:0 22px 60px;
}

/* ---------- Hero ---------- */
.hero{
  position:relative;
  min-height:440px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:30px 0 26px;
}
.eyebrow-tick{
  width:26px; height:1px;
  background:var(--ink-soft);
  margin-bottom:14px;
}
.eyebrow-en{
  font-family:'Zen Kaku Gothic New', sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.2em;
  color:var(--ink-soft);
  line-height:1.7;
}
h1{
  font-family:'Yuji Syuku', serif;
  font-weight:400;
  font-size:clamp(34px, 12vw, 58px);
  line-height:0.95;
  margin:0 0 4px;
  letter-spacing:0.02em;
  color:var(--gold);
  text-shadow: 0 2px 10px rgba(0,0,0,0.6), 0 0 22px rgba(217,180,106,0.22);
  white-space:nowrap;
}
.brush-underline{
  width:130px; height:12px;
  display:block;
  margin-bottom:4px;
}
.brush-underline path{ fill:var(--gold); opacity:0.9; }

.hero .sub{
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.8;
  max-width:300px;
  margin:0;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}
.eyebrow-en, .hero .sub{ max-width:300px; }

/* ---------- Divider ---------- */
.divider-row{
  position:relative;
  height:1px;
  background:var(--line);
  margin:0;
}
.divider-row::after{
  content:"";
  position:absolute;
  left:50%; top:50%;
  width:7px; height:7px;
  background:var(--ink-soft);
  transform:translate(-50%,-50%) rotate(45deg);
}

/* ---------- TOC ---------- */
.toc{ margin-top:0; }
.toc-item{
  display:flex;
  align-items:center;
  gap:20px;
  padding:26px 2px;
  border-bottom:1px solid var(--line);
  text-decoration:none;
  color:inherit;
  position:relative;
  isolation:isolate;
}
.toc-item::before{
  content:"";
  position:absolute;
  inset:0 -2px;
  background:var(--tint);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .3s cubic-bezier(.3,.8,.3,1);
  z-index:-1;
}
.toc-item:active::before{ transform:scaleX(1); }

.toc-num{
  font-family:'Zen Kaku Gothic New', sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.05em;
  color:var(--ink-soft);
  width:20px;
  flex-shrink:0;
}
.toc-num::after{
  content:"";
  display:block;
  width:16px; height:1px;
  background:var(--ink-soft);
  margin-top:7px;
}
.toc-glyph{
  flex-shrink:0;
  width:50px;
  text-align:center;
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:32px;
  color:var(--accent);
}
.toc-body{ flex:1; min-width:0; }
.toc-category{
  font-size:11px;
  letter-spacing:0.1em;
  color:var(--accent);
  font-weight:700;
  margin-bottom:5px;
}
.toc-title{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:19px;
  margin:0 0 6px;
  letter-spacing:0.01em;
  color:var(--ink);
}
.toc-blurb{
  font-size:12.5px;
  color:var(--ink-soft);
  line-height:1.7;
  margin:0;
}
.toc-arrow{
  flex-shrink:0;
  width:32px; height:32px;
  border-radius:50%;
  border:1px solid var(--line);
  color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  transition: background .18s, border-color .18s, transform .18s, color .18s;
}
.toc-arrow svg{ width:13px; height:13px; }
.toc-item:active .toc-arrow{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--bg);
  transform:translateX(3px);
}

/* ---------- Bottom row ---------- */
footer.site-footer{
  margin-top:26px;
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:0.05em;
  text-align:right;
  padding-bottom:2px;
}

@media (min-width:520px){
  .hero{ min-height:480px; }
}
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <div class="hero-top">
      <div class="eyebrow-tick"></div>
      <div class="eyebrow-en">TODAI TOKUSHIN<br>STUDY INDEX</div>
    </div>
    <div class="hero-bottom">
      <h1>東大特進</h1>
      <svg class="brush-underline" viewBox="0 0 200 20" xmlns="http://www.w3.org/2000/svg">
        <path d="M2,15 C40,7 90,17 138,9 C158,6 178,11 196,5 L197,11 C172,17 150,11 130,15 C90,21 40,12 3,19 Z"/>
      </svg>
      <p class="sub">科目ごとの学習ツールをここから開けます。取り込んだデータや進捗は各ツールの中に保存されます。</p>
    </div>
  </div>

  <div class="divider-row"></div>

  <nav class="toc" id="toc"></nav>

  <footer class="site-footer">個人学習用</footer>

</div>

<script>
const TOOLS = [
  {
    href: "kanbun/",
    category: "国語 · 漢文",
    glyph: "漢",
    accent: "var(--seal)",
    tint: "rgba(209,73,58,0.10)",
    title: "漢文重要単語300",
    blurb: "句形・重要語300語をフラッシュカードで反復。読み方と意味を一気に固める。"
  },
  {
    href: "listening/",
    category: "英語 · リスニング",
    glyph: "聴",
    accent: "var(--indigo)",
    tint: "rgba(143,176,214,0.10)",
    title: "リスニング・ライブラリ",
    blurb: "教材音声をまとめて取り込み、10秒巻き戻し・通し再生でリスニング練習。"
  }
];

const toc = document.getElementById("toc");
TOOLS.forEach((t, i) => {
  const a = document.createElement("a");
  a.href = t.href;
  a.className = "toc-item";
  a.style.setProperty("--accent", t.accent);
  a.style.setProperty("--tint", t.tint);
  a.innerHTML = `
    <div class="toc-num">${String(i + 1).padStart(2, "0")}</div>
    <div class="toc-glyph">${t.glyph}</div>
    <div class="toc-body">
      <div class="toc-category">${t.category}</div>
      <h3 class="toc-title">${t.title}</h3>
      <p class="toc-blurb">${t.blurb}</p>
    </div>
    <div class="toc-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  `;
  toc.appendChild(a);
});
</script>

</body>
</html>
